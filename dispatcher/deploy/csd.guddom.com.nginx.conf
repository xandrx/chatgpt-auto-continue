# Included inside the Vesta-managed HTTP and HTTPS server blocks for csd.guddom.com.
# Only the extension's enrollment and per-session worker endpoints are proxied.
# Admin REST endpoints, MCP endpoints and health are deliberately not public.

location = /v1/client/enroll {
    if ($scheme != https) { return 301 https://$host$request_uri; }
    limit_except POST OPTIONS { deny all; }
    proxy_pass http://127.0.0.1:8766;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 40s;
    proxy_buffering off;
}

location ~ ^/v1/sessions/[A-Za-z0-9_-]+/(heartbeat|claim|wait|ack)$ {
    if ($scheme != https) { return 301 https://$host$request_uri; }
    limit_except POST OPTIONS { deny all; }
    proxy_pass http://127.0.0.1:8766;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 40s;
    proxy_buffering off;
}

location / {
    return 404;
}
