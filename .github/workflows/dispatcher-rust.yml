name: Dispatcher Rust CI
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'dispatcher/rust/**'
      - 'dispatcher/extension/**'
      - '.github/workflows/dispatcher-rust.yml'
  push:
    paths:
      - 'dispatcher/rust/**'
      - 'dispatcher/extension/**'
      - '.github/workflows/dispatcher-rust.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dispatcher/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: python3 tests/schema_smoke.py
      - run: python3 tests/http_smoke.py target/release/chatgpt-session-dispatcher
      - run: python3 tests/load_smoke.py target/release/chatgpt-session-dispatcher
      - run: python3 tests/mcp_smoke.py target/release/chatgpt-session-dispatcher
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          rustup target add x86_64-unknown-linux-musl
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
      - name: Build static Linux binary for Debian VPS
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Smoke-test static Linux binary
        run: |
          python3 tests/http_smoke.py target/x86_64-unknown-linux-musl/release/chatgpt-session-dispatcher
          python3 tests/load_smoke.py target/x86_64-unknown-linux-musl/release/chatgpt-session-dispatcher
          python3 tests/mcp_smoke.py target/x86_64-unknown-linux-musl/release/chatgpt-session-dispatcher
      - name: Upload Debian-compatible static binary
        uses: actions/upload-artifact@v4
        with:
          name: dispatcher-linux-x86_64-musl
          path: dispatcher/rust/target/x86_64-unknown-linux-musl/release/chatgpt-session-dispatcher
          if-no-files-found: error
          retention-days: 7
      - name: Check MV3 extension syntax
        working-directory: .
        run: |
          node --check dispatcher/extension/background.js
          node --check dispatcher/extension/content.js
          node --check dispatcher/extension/popup.js
          node dispatcher/extension/tests/background.test.js
          python3 -c "import json,pathlib; json.loads(pathlib.Path('dispatcher/extension/manifest.json').read_text())"
